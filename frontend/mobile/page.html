<title>NCDAI Consult</title>
<style>
/* Layout: one-column clinical consult app; sticky bar, two tabs, sticky action at the thumb. */
:root {
  --bg:#fbf7f6; --surface:#ffffff; --sunk:#f5eeec; --ink:#2b2222; --muted:#6c5d5a; --line:#eadcd9;
  --accent:#c93636; --accent-ink:#ffffff; --accent-soft:#ffe8e5; --brand:#ff5757;
  --crit:#9d2a22; --crit-bg:#fdecea; --warn:#7a5a10; --warn-bg:#fff5dc; --good:#2f6b3e; --good-bg:#e9f5eb; --info:#44566b; --info-bg:#edf1f6;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --radius:14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#161110; --surface:#211918; --sunk:#2a201e; --ink:#f2e9e7; --muted:#b8a9a6; --line:#3b2e2b;
  --accent:#ff7b72; --accent-ink:#2a0f0d; --accent-soft:#3c211f; --brand:#ff6b6b;
  --crit:#ff968c; --crit-bg:#3d1c19; --warn:#f0c76e; --warn-bg:#342914; --good:#93d7a4; --good-bg:#17301f; --info:#a9c0dc; --info-bg:#1c2633; color-scheme:dark; } }
:root[data-theme="dark"] {
  --bg:#161110; --surface:#211918; --sunk:#2a201e; --ink:#f2e9e7; --muted:#b8a9a6; --line:#3b2e2b;
  --accent:#ff7b72; --accent-ink:#2a0f0d; --accent-soft:#3c211f; --brand:#ff6b6b;
  --crit:#ff968c; --crit-bg:#3d1c19; --warn:#f0c76e; --warn-bg:#342914; --good:#93d7a4; --good-bg:#17301f; --info:#a9c0dc; --info-bg:#1c2633; color-scheme:dark; }
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html,body { margin:0; }
body { background:var(--bg); color:var(--ink); font-family:var(--font); font-size:15px; line-height:1.5; -webkit-text-size-adjust:100%; }
button,input,select,textarea { font:inherit; color:inherit; }
:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
.bar { position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--surface); border-bottom:1px solid var(--line); }
.bar-inner { max-width:760px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:10px; }
.bar img { width:34px; height:34px; border-radius:9px; }
.bar h1 { margin:0; font-size:17px; line-height:1.1; letter-spacing:-.01em; }
.bar small { display:block; font-size:11.5px; color:var(--muted); font-weight:500; }
.bar .spacer { flex:1; }
.tabs { max-width:760px; margin:0 auto; padding:0 16px 10px; display:grid; grid-template-columns:1fr 1fr; gap:6px; }
.tabs button { border:1px solid var(--line); background:var(--sunk); border-radius:10px; padding:8px; font-weight:600; font-size:14px; cursor:pointer; }
.tabs button[aria-selected="true"] { background:var(--ink); color:var(--bg); border-color:var(--ink); }
main { max-width:760px; margin:0 auto; padding:14px 16px 120px; display:grid; gap:14px; }
.ghost { border:1px solid var(--line); background:transparent; border-radius:10px; padding:7px 11px; font-size:13px; font-weight:600; cursor:pointer; }
.primary { border:0; background:var(--accent); color:var(--accent-ink); border-radius:12px; padding:13px 18px; font-weight:700; font-size:15.5px; cursor:pointer; width:100%; }
.actionbar { position:fixed; left:0; right:0; bottom:0; z-index:6; background:linear-gradient(to top,var(--bg) 70%,transparent); padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px)); }
.actionbar div { max-width:760px; margin:0 auto; }
.card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:15px; min-width:0; }
.eyebrow { font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
.examples { display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none; }
.examples button { flex:0 0 auto; border:1px solid var(--line); background:var(--surface); border-radius:99px; padding:7px 12px; font-size:13px; cursor:pointer; white-space:nowrap; }
.examples button[aria-pressed="true"] { border-color:var(--accent); background:var(--accent-soft); color:var(--ink); font-weight:600; }
.notice { border-radius:12px; padding:11px 13px; font-size:13.5px; }
.notice.example { background:var(--info-bg); color:var(--info); }
.notice.error { background:var(--crit-bg); color:var(--crit); font-weight:600; }
.triage { display:grid; gap:10px; border-left:5px solid var(--good); }
.triage.u-emergency { border-left-color:var(--crit); background:var(--crit-bg); }
.triage.u-urgent { border-left-color:var(--crit); }
.triage.u-soon { border-left-color:var(--warn); }
.pill { display:inline-block; font-size:11.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; border-radius:99px; padding:3px 9px; }
.p-emergency,.p-urgent,.p-critical,.p-acute,.p-high { background:var(--crit-bg); color:var(--crit); }
.p-soon,.p-warning,.p-uncontrolled,.p-untreated,.p-above_target,.p-high_risk,.p-review,.p-moderate { background:var(--warn-bg); color:var(--warn); }
.p-routine,.p-at_target,.p-established { background:var(--good-bg); color:var(--good); }
.p-info,.p-unconfirmed,.p-needs_confirmation,.p-at_risk,.p-needs_data,.p-withheld,.p-low { background:var(--info-bg); color:var(--info); }
.triage h2 { margin:0; font-size:17px; line-height:1.3; text-wrap:balance; }
.findings { list-style:none; margin:0; padding:0; display:grid; gap:8px; }
.findings li { background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:9px 11px; }
.findings strong { display:block; font-size:14px; }
.findings p { margin:3px 0 0; font-size:13px; color:var(--muted); }
.lead h2 { margin:4px 0 6px; font-size:17px; line-height:1.4; text-wrap:balance; }
.lead p { margin:0; font-size:14px; }
.lead .acute { color:var(--crit); font-weight:650; }
.tiles { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:8px; }
.tile { background:var(--sunk); border-radius:11px; padding:9px 11px; min-width:0; }
.tile span { display:block; font-size:11.5px; color:var(--muted); }
.tile strong { display:block; font-size:20px; font-variant-numeric:tabular-nums; letter-spacing:-.01em; }
.tile strong small { font-size:11px; font-weight:500; color:var(--muted); }
.tile em { display:block; font-style:normal; font-size:12px; overflow-wrap:anywhere; }
.problem { border-left:5px solid var(--line); }
.problem.t-crit { border-left-color:var(--crit); } .problem.t-warn { border-left-color:var(--warn); } .problem.t-good { border-left-color:var(--good); } .problem.t-info { border-left-color:var(--info); }
.problem-head { display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
.problem-head h3 { margin:0; font-size:15.5px; flex:1; min-width:0; }
.rank { width:24px; height:24px; border-radius:50%; background:var(--sunk); display:grid; place-items:center; font-size:12px; font-weight:700; }
.facts { display:flex; flex-wrap:wrap; gap:6px; margin:9px 0 0; padding:0; list-style:none; }
.facts li { background:var(--sunk); border-radius:7px; padding:3px 8px; font-size:12.5px; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }
.assessment { margin:9px 0 0; font-size:14px; }
.target { margin:7px 0 0; font-size:13px; }
.target b { font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--good); margin-right:5px; }
.plan { margin:10px 0 0; padding-left:20px; display:grid; gap:7px; font-size:14px; }
.src { display:inline-flex; flex-wrap:wrap; gap:4px; margin-left:4px; vertical-align:1px; }
.src a { font-size:10.5px; border:1px solid var(--line); border-radius:6px; padding:0 5px; color:var(--accent); text-decoration:none; white-space:nowrap; }
.section-title { margin:0 0 8px; font-size:15px; }
.review { list-style:none; margin:0; padding:0; display:grid; gap:8px; }
.review li { display:flex; gap:10px; align-items:flex-start; }
.review li > div { min-width:0; font-size:13.5px; }
.review strong { display:block; }
.plain { margin:0; padding-left:18px; display:grid; gap:6px; font-size:13.5px; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th,td { text-align:left; padding:7px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
th { font-size:11.5px; color:var(--muted); font-weight:600; }
.table-wrap { overflow-x:auto; }
details summary { cursor:pointer; font-weight:650; font-size:14px; }
pre { white-space:pre-wrap; overflow-wrap:anywhere; font-family:var(--mono); font-size:12px; line-height:1.5; background:var(--sunk); border-radius:10px; padding:11px; max-height:360px; overflow:auto; }
.row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.boundary { font-size:12px; color:var(--muted); margin:0; }
form { display:grid; gap:14px; }
fieldset { border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); margin:0; padding:13px 14px 15px; min-width:0; }
legend { font-weight:700; font-size:14.5px; padding:0 4px; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px 12px; }
label.f { display:grid; gap:4px; font-size:12.5px; color:var(--muted); font-weight:600; min-width:0; }
label.f input,label.f select,textarea { width:100%; min-width:0; border:1px solid var(--line); background:var(--bg); border-radius:9px; padding:9px 10px; font-size:15px; color:var(--ink); font-weight:400; }
.tri { display:grid; gap:4px; min-width:0; }
.tri > span { font-size:12.5px; color:var(--muted); font-weight:600; }
.seg { display:grid; grid-template-columns:repeat(3,1fr); border:1px solid var(--line); border-radius:9px; overflow:hidden; }
.seg label { position:relative; text-align:center; font-size:13px; padding:7px 2px; cursor:pointer; background:var(--bg); }
.seg label + label { border-left:1px solid var(--line); }
.seg input { position:absolute; opacity:0; inset:0; margin:0; cursor:pointer; }
.seg label:has(input:checked) { background:var(--ink); color:var(--bg); font-weight:650; }
.seg label:has(input:focus-visible) { outline:3px solid var(--accent); outline-offset:-3px; }
.chips { display:flex; flex-wrap:wrap; gap:7px; }
.chip { position:relative; border:1px solid var(--line); border-radius:99px; padding:6px 11px; font-size:13px; cursor:pointer; background:var(--bg); }
.chip input { position:absolute; opacity:0; inset:0; margin:0; cursor:pointer; }
.chip:has(input:checked) { background:var(--accent-soft); border-color:var(--accent); font-weight:650; }
.chip:has(input:focus-visible) { outline:3px solid var(--accent); }
.medlist { list-style:none; margin:8px 0 0; padding:0; display:flex; flex-wrap:wrap; gap:7px; }
.medlist li { display:flex; align-items:center; gap:6px; background:var(--sunk); border-radius:99px; padding:4px 5px 4px 11px; font-size:13.5px; }
.medlist button { border:0; background:var(--surface); border-radius:50%; width:26px; height:26px; cursor:pointer; font-size:15px; line-height:1; }
.toggle { display:flex; gap:9px; align-items:flex-start; font-size:14px; }
.toggle input { width:20px; height:20px; margin-top:1px; accent-color:var(--accent); }
.hint { font-size:12.5px; color:var(--muted); margin:6px 0 0; }
footer.note { max-width:760px; margin:0 auto; padding:0 16px 130px; font-size:12px; color:var(--muted); }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior:auto !important; } }
</style>

<header class="bar">
  <div class="bar-inner">
    <img src="ncdai-logo.png" alt="" width="34" height="34">
    <div><h1>NCDAI Consult</h1><small>Offline NCD consult · clinicians</small></div>
    <span class="spacer"></span>
    <button class="ghost" id="new-patient" type="button">New patient</button>
  </div>
  <div class="tabs" role="tablist" aria-label="Views">
    <button role="tab" id="tab-consult" aria-controls="consult-view" aria-selected="true" type="button">Consult</button>
    <button role="tab" id="tab-patient" aria-controls="patient-view" aria-selected="false" type="button">Patient data</button>
  </div>
</header>

<main>
  <div class="examples" id="examples" aria-label="Example patients"></div>
  <section id="consult-view" role="tabpanel" aria-labelledby="tab-consult" aria-live="polite"></section>
  <form id="patient-view" role="tabpanel" aria-labelledby="tab-patient" hidden novalidate></form>
</main>
<footer class="note">For clinicians. Decision support to review against the full clinical picture; it does not diagnose, prescribe or set doses. Everything runs on this device: nothing you enter is stored or sent. Rules <span id="versions"></span>.</footer>
<div class="actionbar"><div><button class="primary" id="generate" type="button">Generate consult</button></div></div>

<script src="evidence.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
