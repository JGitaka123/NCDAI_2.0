name: Deploy production (manual)

# Manual-only production deploy through the Vercel CLI, matching docs/deployment.md.
# Nothing deploys on push. Requires the repository secret VERCEL_TOKEN.
# The checks afterwards are read-only: they never sign in or create records.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or branch to deploy
        required: true
        default: codex/ncdai-2-platform

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

env:
  VERCEL_SCOPE: jessegitaka-7527s-projects
  VERCEL_PROJECT: ncdai-2
  SITE: https://ncdai-2.vercel.app

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Require exact-commit quality
        run: |
          export NCDAI_RELEASE_SHA="$(git rev-parse HEAD)"
          python3 - <<'QUALITY_GATE'
          """Read-only public CI gate. No token, deployment, or patient data access."""
          import json
          import os
          import re
          import sys
          from urllib.request import Request, urlopen

          REPOSITORY = "JGitaka123/NCDAI_2.0"
          QUALITY_WORKFLOW_ID = 356656520
          REQUIRED_JOBS = {"backend", "frontend", "postgres"}


          def latest_quality_run(payload, sha):
              if not re.fullmatch(r"[0-9a-f]{40}", sha):
                  raise ValueError("A resolved 40-character commit SHA is required")
              runs = payload.get("workflow_runs", [])
              matches = [run for run in runs if run.get("head_sha") == sha and run.get("workflow_id") == QUALITY_WORKFLOW_ID]
              if not matches:
                  raise ValueError("No quality run exists for the selected commit")
              latest = max(matches, key=lambda run: int(run["id"]))
              if latest.get("status") != "completed" or latest.get("conclusion") != "success":
                  raise ValueError("The latest quality run for the selected commit has not passed")
              return latest


          def verify_jobs(payload):
              jobs = payload.get("jobs", [])
              if payload.get("total_count", len(jobs)) > len(jobs):
                  raise ValueError("Quality-job response is incomplete")
              for name in REQUIRED_JOBS:
                  matching = [job for job in jobs if job.get("name") == name]
                  if len(matching) != 1 or matching[0].get("status") != "completed" or matching[0].get("conclusion") != "success":
                      raise ValueError(f"Required quality job has not passed: {name}")


          def fetch_json(path):
              request = Request("https://api.github.com/repos/" + REPOSITORY + path,
                                headers={"Accept": "application/vnd.github+json", "User-Agent": "NCDAI-read-only-release-gate"})
              with urlopen(request, timeout=20) as response:
                  content = response.read(2_000_001)
                  if len(content) > 2_000_000:
                      raise ValueError("Quality response exceeds the supported limit")
                  return json.loads(content)


          def main():
              sha = os.environ.get("NCDAI_RELEASE_SHA", "")
              if not re.fullmatch(r"[0-9a-f]{40}", sha):
                  raise ValueError("A resolved 40-character commit SHA is required")
              run = latest_quality_run(fetch_json(f"/actions/workflows/{QUALITY_WORKFLOW_ID}/runs?head_sha={sha}&per_page=100"), sha)
              verify_jobs(fetch_json(f"/actions/runs/{int(run['id'])}/jobs?filter=latest&per_page=100"))
              print(f"Quality passed for {sha}: https://github.com/{REPOSITORY}/actions/runs/{int(run['id'])}")


          if __name__ == "__main__":
              try:
                  main()
              except Exception:
                  # No deployment credential is available here. A network/API/parse error
                  # still blocks release rather than falling back to an older green run.
                  print("::error::Release blocked: exact-commit quality verification failed. Check the latest quality run and retry only after all required jobs pass.", file=sys.stderr)
                  sys.exit(1)
          QUALITY_GATE
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: npm install --global vercel@59.14.0
      - name: Check the deployment credential
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::VERCEL_TOKEN is not set. Add it as a repository secret."
            exit 1
          fi
          if ! vercel whoami --token "$VERCEL_TOKEN" >/dev/null 2>&1; then
            echo "::error::VERCEL_TOKEN was rejected by Vercel (the CLI reports \"User not found\"). The token is invalid, revoked or expired: create a new one at https://vercel.com/account/settings/tokens with access to the $VERCEL_SCOPE scope and replace the VERCEL_TOKEN repository secret."
            exit 1
          fi
          echo "Authenticated as $(vercel whoami --token "$VERCEL_TOKEN")"
      - name: Link project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel link --yes --project "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
      - name: Deploy to production (fra1)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "Deploying commit $(git rev-parse HEAD)"
          url=$(vercel deploy --prod --yes --regions fra1 --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployment: $url"
      - name: Inspect deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: vercel inspect "$DEPLOY_URL" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
      - name: HTTP checks
        run: |
          set -euo pipefail
          ready=$(curl -sS -w '\n%{http_code}' "$SITE/api/health/ready")
          echo "ready: $ready"
          echo "$ready" | tail -1 | grep -qx 200
          echo "$ready" | grep -q '"rules":"loaded"'
          for p in /api/health/live /manifest.webmanifest /sw.js /icons/icon-512.png /mobile/ /; do
            c=$(curl -sS -o /dev/null -w '%{http_code}' "$SITE$p")
            echo "$p -> $c"
            test "$c" = 200
          done
          curl -sSI "$SITE/sw.js" | grep -i '^cache-control: no-cache'
          echo "Security headers on /:"
          curl -sSI "$SITE/" | grep -iE '^(content-security-policy|x-frame-options|x-content-type-options|referrer-policy|permissions-policy|strict-transport-security):'
      - name: Browser checks at phone width
        run: |
          npm --prefix frontend ci --no-audit --no-fund
          cd frontend
          npx playwright install --with-deps chromium
          node tests/browser/live-check.mjs "$SITE"
