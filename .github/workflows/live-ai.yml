name: Explicit synthetic DeepSeek evaluation

on:
  workflow_dispatch:
    inputs:
      live_ai:
        description: Authorize billed DeepSeek requests for all 66 synthetic cases
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  synthetic-deepseek:
    if: inputs.live_ai == true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt
      - name: Full synthetic cases with real DeepSeek requests
        env:
          DEEPSEEK_API_KEY: ${{ secrets.NCDAI2_0_DEEPSEEK }}
          NCDAI_CASE_LIVE_AI: '1'
        run: python scripts/run_case_workflows.py docs/test-results/ci-cases-deepseek.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: explicit-synthetic-deepseek-evaluation
          path: docs/test-results/ci-cases-deepseek.json
          retention-days: 14
